# Сборка образа API с Chromium в GitHub Actions → GHCR.
# На слабом VPS: docker login ghcr.io + pull + up --no-build (без docker build на сервере).

name: Docker API (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-api.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR требует lowercase)
        id: image
        run: |
          lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "full=${{ env.REGISTRY }}/${lower}/fitness-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            INSTALL_CHROMIUM=1
          tags: |
            ${{ steps.image.outputs.full }}:latest
            ${{ steps.image.outputs.full }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Образы:"
          echo "  ${{ steps.image.outputs.full }}:latest"
          echo "  ${{ steps.image.outputs.full }}:${{ github.sha }}"
          echo ""
          echo "На VPS: API_IMAGE (и опционально WEB_IMAGE) в deploy/.env.production, pull + up --no-build — см. deploy/SERVER_5FIT.md §11."
