# Продакшен: Postgres + Nest API + Nginx (SPA + proxy /api). MinIO опционально: --profile minio
#
# Перед запуском: cp deploy/env.production.example deploy/.env.production и заполните секреты.
# Подстановка POSTGRES_PASSWORD в DATABASE_URL делается на этапе парсинга compose — передайте файл:
#   docker compose --env-file deploy/.env.production -f docker-compose.prod.yml up -d --build
# С MinIO (после освобождения места на диске):
#   docker compose --env-file deploy/.env.production -f docker-compose.prod.yml --profile minio up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production and use --env-file}
      POSTGRES_DB: fitnessdb
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - fitness_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitness -d fitnessdb']
      interval: 5s
      timeout: 5s
      retries: 10

  # Включить: docker compose --profile minio ... up -d
  # Без профиля стек поднимается без MinIO (меньше места на диске). Тогда в .env очистите S3_BUCKET.
  minio:
    profiles:
      - minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./deploy/.env.production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitness}
      # Без :? — иначе compose падает при `up` без профиля minio, если переменная не задана.
      # С профилем minio задайте сильный пароль в deploy/.env.production.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data_prod:/data
    ports:
      - '9100:9000'
      - '9101:9001'
    networks:
      - fitness_internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-1}
    restart: unless-stopped
    env_file:
      - ./deploy/.env.production
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD}@postgres:5432/fitnessdb
      CONTRACT_TEMPLATE_PATH: /app/templates/contract-template.pdf
      CONTRACT_TEMPLATE_HTML_PATH: /app/templates/contract-template.html
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      - fitness_internal

  # Если после перезапуска только api снова 502 на /api — пересоздайте web (или убедитесь, что в образе nginx есть resolver 127.0.0.11 в location /api).
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api
    networks:
      - fitness_internal

networks:
  fitness_internal:
    driver: bridge

volumes:
  pgdata_prod:
  minio_data_prod:
