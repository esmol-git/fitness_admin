services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitnessdb
    # Хост 5433 — чтобы не конфликтовать с локальным Postgres на 5432 (Homebrew и т.п.)
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: fitness
      MINIO_ROOT_PASSWORD: fitness12345
    ports:
      - '9100:9000'
      - '9101:9101'
    volumes:
      - minio_data:/data

volumes:
  pgdata: {}
  minio_data: {}
