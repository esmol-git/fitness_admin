# Редирект HTTP→HTTPS только для прямых заходов на :80 (без TLS на хосте).
# За reverse proxy с TLS заголовок X-Forwarded-Proto=https — отдаём SPA, без 301.
map "$http_x_forwarded_proto:$host" $force_http_to_https {
    default           0;
    ":5fit.work.gd"   1;
    ":www.5fit.work.gd" 1;
}

server {
    listen 80;
    server_name 5fit.work.gd www.5fit.work.gd _;

    if ($force_http_to_https = 1) {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    client_max_body_size 25m;

    # Docker меняет IP контейнера api после перезапуска; без resolver Nginx держит старый IP → 502 / connection refused.
    location /api {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
